    stroke-linecap="round"
    filter="url(#neonStarGlow)"
  />
  <polygon points="27,8 30.5,21.5 43,16 36.5,27 43,38 30.5,32.5 27,46 23.5,32.5 11,38 17.5,27 11,16 23.5,21.5"
